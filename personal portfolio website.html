<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="protofolio.css" />
</head>
<body>
<div class="container my-5">
  <header class="text-center mb-4">
    <h1 id="user-name">Enter your name</h1>
    <h2 id="user-course">Your Course</h2>
    <button class="btn btn-primary mt-2" onclick="editName()">Edit Name</button>
    <button class="btn btn-warning mt-2" onclick="editCourse()">Edit Course</button>
  </header>
  <!-- About Me Section -->
  <section id="about" class="mb-5">
    <h2>About Me</h2>
    <input type="text" id="about-input" class="form-control" placeholder="Update your About Me" />
    <button class="btn btn-primary mt-2" onclick="updateAbout()">Update</button>
  </section>

  <!-- Skills Section -->
  <section id="skills" class="mb-5">
    <h2>Skills</h2>
    <ul id="skills-list" class="list-group mb-3"></ul>
    <input type="text" id="skill-input" class="form-control" placeholder="Add a skill" />
    <button class="btn btn-success mt-2" onclick="addSkill()">Add Skill</button>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="mb-5">
    <h2>Projects</h2>
    <ul id="project-list" class="list-group mb-3"></ul>
    <input type="text" id="project-input" class="form-control" placeholder="Add a project title" />
    <button class="btn btn-info mt-2" onclick="addProject()">Add Project</button>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="mb-5">
    <h2>Contact</h2>
    <form id="contact-form" onsubmit="handleContact(event)">
      <input type="text" id="contact-name" class="form-control" placeholder="Your Name" required /><br />
      <input type="email" id="contact-email" class="form-control" placeholder="Your Email" required /><br />
      <textarea id="contact-message" class="form-control" placeholder="Your Message" required></textarea><br />
      <button type="submit" class="btn btn-dark">Send</button>
    </form>
    <div id="contact-success" class="alert alert-success mt-3 d-none">Thank you! Your message has been sent.</div>
  </section>

  <footer class="text-center mt-5">
    <p>© 2025 <span id="footer-name">Enter your name</span>. All rights reserved.</p>
  </footer>
</div>
<script src="protofolio.js"></script>
</body>
</html>
